# Incidentes sintéticos com diagnóstico esperado. Cada caso traz o alerta, os sinais que as fontes
# devolveriam e o que um SRE experiente concluiria. Todos os dados são fictícios.
version: 1
cases:
  - id: saas-noisy-tenant
    description: Um estúdio exporta relatórios em massa e degrada a API para todos.
    alert: { alertname: SaasP99LatencyHigh, service: saas-multitenant }
    metrics:
      p99_by_route:
        - { labels: { route: /api/v1/reports/export }, values: [0.5, 1.8, 2.7] }
        - { labels: { route: /api/v1/bookings }, values: [0.3, 0.9, 1.2] }
      requests_by_tenant:
        - { labels: { tenant: estudio-lotus }, values: [210] }
        - { labels: { tenant: estudio-sol }, values: [14] }
        - { labels: { tenant: estudio-bambu }, values: [11] }
      db_pool_in_use: [{ labels: {}, values: [0.5, 0.65, 0.7] }]
      cpu_utilization: [{ labels: {}, values: [0.45, 0.55, 0.58] }]
    traces:
      slow_requests:
        - { traceId: s1, rootOperation: GET /api/v1/reports/export, durationMs: 2600, spanCount: 9, errorSpans: 0, slowestOperation: { name: reports.render_csv, durationMs: 2100 } }
    expected: { hypothesisId: noisy_tenant, actionId: toggle_feature_flag, outcome: auto_executed }

  - id: saas-slow-query
    description: Consulta sem índice segura conexões; pool saturado com CPU baixa.
    alert: { alertname: SaasP99LatencyHigh, service: saas-multitenant }
    metrics:
      p99_by_route: [{ labels: { route: /api/v1/bookings }, values: [0.3, 1.4, 2.2] }]
      requests_by_tenant:
        - { labels: { tenant: estudio-lotus }, values: [22] }
        - { labels: { tenant: estudio-sol }, values: [19] }
      db_pool_in_use: [{ labels: {}, values: [0.6, 0.97, 1.0] }]
      cpu_utilization: [{ labels: {}, values: [0.3, 0.32, 0.31] }]
    traces:
      slow_requests:
        - { traceId: s2, rootOperation: GET /api/v1/bookings, durationMs: 2300, spanCount: 5, errorSpans: 0, slowestOperation: { name: mysql.query bookings_by_week, durationMs: 2150 } }
    expected: { hypothesisId: slow_query, actionId: notify_oncall, outcome: auto_executed }

  - id: saas-cpu-saturation
    description: Pico de tráfego legítimo e distribuído; pods com CPU no limite.
    alert: { alertname: SaasP99LatencyHigh, service: saas-multitenant }
    metrics:
      p99_by_route: [{ labels: { route: /api/v1/bookings }, values: [0.3, 1.1, 1.5] }]
      requests_by_tenant:
        - { labels: { tenant: estudio-lotus }, values: [48] }
        - { labels: { tenant: estudio-sol }, values: [45] }
        - { labels: { tenant: estudio-bambu }, values: [44] }
      db_pool_in_use: [{ labels: {}, values: [0.4, 0.5, 0.5] }]
      cpu_utilization: [{ labels: {}, values: [0.6, 0.91, 0.95] }]
    traces:
      slow_requests:
        - { traceId: s3, rootOperation: GET /api/v1/bookings, durationMs: 1400, spanCount: 5, errorSpans: 0, slowestOperation: { name: bookings.serialize, durationMs: 900 } }
    expected: { hypothesisId: cpu_saturation, actionId: scale_deployment, outcome: auto_executed }

  - id: payments-downstream-recovered
    description: O ledger ficou fora por 10 minutos, voltou, e a DLQ guarda os eventos da janela.
    alert: { alertname: PaymentsDlqBacklogHigh, service: payments-events-go }
    metrics:
      dlq_depth: [{ labels: { queue: payments.events.dlq }, values: [50, 1300, 1420] }]
      consumer_error_ratio: [{ labels: {}, values: [0.45, 0.04, 0.01] }]
      downstream_up: [{ labels: { dependency: ledger-api }, values: [0, 1, 1] }]
    traces:
      failing_event_processing:
        - { traceId: p1, rootOperation: process_payment_event, durationMs: 260, spanCount: 4, errorSpans: 0, slowestOperation: { name: ledger.post_entry, durationMs: 180 } }
    expected: { hypothesisId: downstream_recovered, actionId: replay_dlq_batch, outcome: awaiting_approval }

  - id: payments-downstream-down
    description: O ledger continua fora; reprocessar agora devolveria tudo para a DLQ.
    alert: { alertname: PaymentsDlqBacklogHigh, service: payments-events-go }
    metrics:
      dlq_depth: [{ labels: { queue: payments.events.dlq }, values: [100, 900, 2100] }]
      consumer_error_ratio: [{ labels: {}, values: [0.1, 0.8, 0.85] }]
      downstream_up: [{ labels: { dependency: ledger-api }, values: [1, 0, 0] }]
    traces:
      failing_event_processing:
        - { traceId: p2, rootOperation: process_payment_event, durationMs: 5000, spanCount: 3, errorSpans: 2, slowestOperation: { name: ledger.post_entry, durationMs: 5000 } }
    expected: { hypothesisId: downstream_outage_ongoing, actionId: notify_oncall, outcome: awaiting_approval }

  - id: payments-poison-message
    description: Eventos de estorno com campo novo falham na desserialização; dependências saudáveis.
    alert: { alertname: PaymentsDlqBacklogHigh, service: payments-events-go }
    metrics:
      dlq_depth: [{ labels: { queue: payments.events.dlq }, values: [10, 160, 320] }]
      consumer_error_ratio: [{ labels: {}, values: [0.03, 0.03, 0.03] }]
      downstream_up: [{ labels: { dependency: ledger-api }, values: [1, 1, 1] }]
    traces:
      failing_event_processing:
        - { traceId: p3, rootOperation: process_payment_event, durationMs: 210, spanCount: 2, errorSpans: 1, slowestOperation: { name: event.decode refund.v2, durationMs: 15 } }
    expected: { hypothesisId: poison_message, actionId: notify_oncall, outcome: awaiting_approval }

  - id: telemetry-underprovisioned
    description: Mais estufas ligadas; produção acima do consumo e lag em todas as partições.
    alert: { alertname: TelemetryConsumerLagHigh, service: kafka-telemetry, labels: { consumergroup: greenhouse-readings-enricher } }
    metrics:
      consumer_lag: [{ labels: { topic: greenhouse.readings.v1 }, values: [2000, 9000, 16000] }]
      ingress_vs_consumed: [{ labels: {}, values: [1.1, 1.4, 1.45] }]
      consumer_replicas: [{ labels: {}, values: [4] }]
      partition_lag:
        - { labels: { partition: '0' }, values: [4100] }
        - { labels: { partition: '1' }, values: [3900] }
        - { labels: { partition: '2' }, values: [4000] }
    traces:
      slow_enrichment:
        - { traceId: k1, rootOperation: enrich_reading, durationMs: 120, spanCount: 4, errorSpans: 0, slowestOperation: { name: tsdb.write, durationMs: 40 } }
    expected: { hypothesisId: consumer_underprovisioned, actionId: scale_deployment, outcome: auto_executed }

  - id: telemetry-poison-record
    description: Uma leitura com schema inválido trava a partição 3; as outras estão em dia.
    alert: { alertname: TelemetryConsumerLagHigh, service: kafka-telemetry, labels: { consumergroup: greenhouse-readings-enricher } }
    metrics:
      consumer_lag: [{ labels: { topic: greenhouse.readings.v1 }, values: [300, 5000, 9800] }]
      ingress_vs_consumed: [{ labels: {}, values: [1.0, 1.02, 1.01] }]
      consumer_replicas: [{ labels: {}, values: [6] }]
      partition_lag:
        - { labels: { partition: '3' }, values: [9700] }
        - { labels: { partition: '1' }, values: [30] }
    traces:
      slow_enrichment:
        - { traceId: k2, rootOperation: enrich_reading, durationMs: 90, spanCount: 3, errorSpans: 3, slowestOperation: { name: schema.decode, durationMs: 60 } }
    expected: { hypothesisId: poison_record, actionId: reset_consumer_offsets, outcome: suggested }

  - id: telemetry-slow-sink
    description: A base de séries temporais está lenta; escalar o consumidor só aumentaria a pressão.
    alert: { alertname: TelemetryConsumerLagHigh, service: kafka-telemetry, labels: { consumergroup: greenhouse-readings-enricher } }
    metrics:
      consumer_lag: [{ labels: { topic: greenhouse.readings.v1 }, values: [1000, 6000, 11000] }]
      ingress_vs_consumed: [{ labels: {}, values: [1.0, 1.3, 1.35] }]
      consumer_replicas: [{ labels: {}, values: [8] }]
      partition_lag:
        - { labels: { partition: '0' }, values: [2800] }
        - { labels: { partition: '1' }, values: [2700] }
    traces:
      slow_enrichment:
        - { traceId: k3, rootOperation: enrich_reading, durationMs: 1900, spanCount: 4, errorSpans: 0, slowestOperation: { name: tsdb.write, durationMs: 1800 } }
        - { traceId: k4, rootOperation: enrich_reading, durationMs: 2100, spanCount: 4, errorSpans: 0, slowestOperation: { name: tsdb.write, durationMs: 2000 } }
    expected: { hypothesisId: slow_sink, actionId: notify_oncall, outcome: auto_executed }

  - id: telemetry-stuck-consumer
    description: Consumidores sem progresso e sem erros depois de um rebalance travado.
    alert: { alertname: TelemetryConsumerLagHigh, service: kafka-telemetry, labels: { consumergroup: greenhouse-readings-enricher } }
    metrics:
      consumer_lag: [{ labels: { topic: greenhouse.readings.v1 }, values: [500, 3000, 6000] }]
      ingress_vs_consumed: [{ labels: {}, values: [1.0, 25, 40] }]
      consumer_replicas: [{ labels: {}, values: [6] }]
      partition_lag:
        - { labels: { partition: '0' }, values: [1000] }
        - { labels: { partition: '1' }, values: [1000] }
    traces:
      slow_enrichment: []
    expected: { hypothesisId: stuck_consumer, actionId: restart_pods, outcome: awaiting_approval }

  - id: unknown-alert
    description: Alerta sem playbook; o copiloto não investiga nem chama o LLM.
    alert: { alertname: NodeDiskAlmostFull, service: saas-multitenant }
    metrics: {}
    traces: {}
    expected: { hypothesisId: null, actionId: null, outcome: no_playbook }
