# Alertmanager de exemplo: envia tudo para o webhook do ops-copilot na rede do compose.
route:
  receiver: ops-copilot
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: ops-copilot
    webhook_configs:
      - url: http://ops-copilot:8080/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            # Somente desenvolvimento. Precisa ser igual a WEBHOOK_TOKEN do .env.
            credentials: dev-only-webhook-token-change-me
