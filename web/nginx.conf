server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # O painel só fala com o copiloto por /api; o prefixo some antes de chegar lá.
  location /api/ {
    proxy_pass http://ops-copilot:8080/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  location = /healthz {
    access_log off;
    return 200 'ok';
  }
}
