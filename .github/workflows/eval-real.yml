name: eval-real

# Eval com modelo real, sob demanda. Nunca roda em PR: custa dinheiro e usa segredo.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Modelo no OpenRouter
        required: true
        default: openai/gpt-4o-mini

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Eval com modelo real
        env:
          LLM_PROVIDER: openrouter
          LLM_BASE_URL: https://openrouter.ai/api/v1
          LLM_MODEL: ${{ inputs.model }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm eval --model real --out evals/reports/real.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-real
          path: evals/reports/
