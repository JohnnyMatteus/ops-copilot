name: ci

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancela execuções antigas só em PR; na main cada commit mantém seu resultado.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: lint, typecheck, testes, evals e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Sem "version": a action lê o campo packageManager do package.json.
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node (versão do .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validar playbooks e política de autonomia
        run: pnpm validate:playbooks

      - name: Testes
        run: pnpm test

      # Modelo falso roteirizado: nenhum LLM real é chamado no CI.
      - name: Evals (modelo falso)
        run: pnpm eval

      - name: Build
        run: pnpm build

  web:
    name: painel (lint, typecheck, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Instalar Node (versão do .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: compose e imagem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validar docker-compose
        run: |
          docker compose --profile core --profile observability config -q
          docker compose -f docker-compose.yml -f docker-compose.portfolio.yml --profile core config -q
          docker compose -f docker-compose.yml -f docker-compose.evidencia.yml --profile core --profile observability config -q

      - name: Validar configuração do Prometheus
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /etc/prometheus/incident-rules.yml

      - name: Validar configuração do Alertmanager
        run: docker run --rm -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml

      - name: Build da imagem
        run: docker build -t ops-copilot:ci .

      - name: Build da imagem do painel
        run: docker build -t ops-copilot-web:ci web

  s3-localstack:
    name: S3 local (LocalStack) e object lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node (versão do .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # O perfil core inteiro pelo compose real: --wait só retorna com todos os healthchecks verdes, e o do
      # LocalStack só passa depois que o init-s3.sh terminou sem erro (bucket com object lock criado).
      - name: Subir o perfil core (compose real, --wait)
        run: |
          set -o pipefail
          docker compose --profile core up -d --build --wait --wait-timeout 600 2>&1 | tee compose-up.log

      - name: Provar o object lock (testes de integração existentes, sem afrouxar)
        run: |
          set -o pipefail
          pnpm exec vitest run --config vitest.integration.config.ts tests/integration/s3-audit.integration.test.ts 2>&1 | tee s3-integration.log

      - name: Logs do compose em caso de falha
        if: failure()
        run: docker compose --profile core logs --no-color --tail=200 localstack ops-copilot

      # Só no runner: derruba o ambiente e apaga os volumes.
      - name: Derrubar o ambiente
        if: always()
        run: docker compose --profile core down -v --remove-orphans
